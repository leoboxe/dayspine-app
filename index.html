    <script>
      /*
       * Catch `beforeinstallprompt` here, in the head, before the bundle exists.
       *
       * ⭐ THIS IS WHY THE INSTALL BANNER NEVER APPEARED. Chrome fires the event
       * within a few hundred milliseconds of load, as soon as it has validated
       * the manifest and the service worker. Our React listener attaches inside
       * an effect that cannot run until the fonts, the sql.js wasm, the SQLite
       * migrations and the legacy purge have all resolved — seconds later, on a
       * phone. The event had already fired and gone, and the event is single-use
       * and not replayable, so the banner had nothing to show and silently
       * rendered nothing. It looked exactly like "the browser doesn't support
       * installing", which is why it read as correct behaviour.
       *
       * Stashed on window, and the component drains it on mount.
       */
      window.__dayspineInstallEvent = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__dayspineInstallEvent = e;
        window.dispatchEvent(new Event('dayspine:installable'));
      });
      window.addEventListener('appinstalled', function () {
        window.__dayspineInstallEvent = null;
      });
    </script>
